<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">兰轩 三国杀 1v1 在线对战</title>
  <desc id="desc">用于社交平台分享的兰轩网页预览图，展示聊天、关系状态和三国杀对局。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".62" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1e3a8a" flood-opacity=".18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#0f172a" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="92" r="160" fill="#38bdf8" opacity=".14"/>
  <circle cx="150" cy="548" r="210" fill="#2563eb" opacity=".11"/>
  <g filter="url(#soft)">
    <rect x="720" y="92" width="324" height="430" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="752" y="126" width="126" height="176" rx="12" fill="#fee2e2" stroke="#fecaca" stroke-width="3"/>
    <text x="815" y="223" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="64" font-weight="800" fill="#dc2626">杀</text>
    <rect x="890" y="166" width="126" height="176" rx="12" fill="#dcfce7" stroke="#bbf7d0" stroke-width="3"/>
    <text x="953" y="263" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="64" font-weight="800" fill="#16a34a">闪</text>
    <rect x="770" y="318" width="226" height="84" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="883" y="352" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">关系状态同步</text>
    <text x="883" y="382" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="17" fill="#64748b">好感度 59 · 信任度 50</text>
    <rect x="770" y="426" width="226" height="48" rx="12" fill="#2563eb"/>
    <text x="883" y="458" text-anchor="middle" font-family="'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">开始一局</text>
  </g>
  <g>
    <rect x="118" y="96" width="78" height="78" rx="20" fill="url(#ink)"/>
    <text x="157" y="149" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="38" font-weight="800" fill="#7dd3fc">兰</text>
    <text x="118" y="244" font-family="Georgia, 'Noto Serif SC', serif" font-size="86" font-weight="800" fill="#0f172a">兰轩</text>
    <text x="118" y="306" font-family="'Noto Sans SC', sans-serif" font-size="34" font-weight="700" fill="#1e40af">能聊天，也能打一局三国杀</text>
    <text x="118" y="374" font-family="'Noto Sans SC', sans-serif" font-size="24" fill="#475569">AI 对话、好感度、信任度、武将技能和 1v1 对局已经整合到同一个可分享网页。</text>
    <g font-family="'Noto Sans SC', sans-serif" font-size="19" font-weight="700">
      <rect x="118" y="432" width="134" height="42" rx="21" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="185" y="459" text-anchor="middle" fill="#2563eb">AI 聊天</text>
      <rect x="270" y="432" width="146" height="42" rx="21" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="343" y="459" text-anchor="middle" fill="#2563eb">关系成长</text>
      <rect x="434" y="432" width="166" height="42" rx="21" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="517" y="459" text-anchor="middle" fill="#2563eb">三国杀 1v1</text>
    </g>
  </g>
</svg>
